<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MoveDaily</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar bg-white border-bottom">
    <div class="container"><a class="navbar-brand fw-bold text-success" href="login.html">MoveDaily</a></div>
  </nav>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-icon">👋</div>
      <h1 class="h2">Welcome back</h1>
      <p class="text-secondary">Log in to view your fitness dashboard.</p>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" for="email">Email address</label>
          <input class="form-control" id="email" type="email" placeholder="alex@email.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" type="password" placeholder="Enter your password" required>
        </div>
        <button class="btn btn-success w-100" type="submit">Log in</button>
      </form>
      <p class="small text-secondary text-center mt-4 mb-0">Demo project: any email and password will work. Your password is not saved.</p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
